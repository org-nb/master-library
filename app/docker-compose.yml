# Local integration stack (ADR-0004 plan): R2 stand-in for S3-dependent
# tests. The app itself runs via `pnpm dev` or `node build/index.js` with
# env pointing at MinIO.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpassword
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
